<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンプル（文字版）｜体験講座LP</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: linear-gradient(180deg, #faf7ff 0%, #f3edfb 100%);
  color: #463a63;
  line-height: 1.9;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 36px 20px 56px; position: relative; }
h2 {
  font-size: 27px; color: #5b4390; text-align: center; margin: 26px 0 30px; font-weight: 700;
}
.card {
  background: #fff; border-radius: 22px; padding: 30px 24px;
  box-shadow: 0 3px 14px rgba(91,67,144,.07);
}
.card p { font-size: 21px; font-weight: 600; margin: 18px 0; }
.card p:first-child { margin-top: 0; }
.card p:last-child { margin-bottom: 0; }
.pink { color: #e7548c; font-size: 21px; font-weight: 700; text-align: center; margin: 38px 0 8px; }
.wishes { text-align: center; font-size: 24px; font-weight: 700; color: #5b4390; margin: 20px 0; line-height: 2.1; }
.last { text-align: center; font-size: 20px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
<h2>こんなふうに感じていませんか？</h2>
<div class="card">
<p>何度伝えても、分かってもらえない</p>
<p>どうして私ばかり頑張っているんだろう</p>
<p>相手さえ変われば幸せになれるのに</p>
</div>
<p class="pink">本当は、相手を責めたいわけではない。</p>
<p class="wishes">分かってほしい。<br>大切にしてほしい。<br>安心したい。</p>
<p class="last">ただ、それだけなのかもしれません。</p>
</div>
</body>
</html>
